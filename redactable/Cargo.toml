[package]
name = "redactable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Automatic redaction of sensitive data in structs for safe logging and debugging"
license-file = "../LICENSE.md"
repository.workspace = true
documentation = "https://docs.rs/redactable"
homepage.workspace = true
readme = "../README.md"
keywords = ["redaction", "privacy", "security", "logging", "telemetry"]
categories = ["development-tools", "data-structures"]
# Explicitly include only what should be published to crates.io
include = ["src/**/*.rs", "Cargo.toml", "docs/**/*.md", "CONTRIBUTING.md", "CHANGELOG.md", "../README.md", "../LICENSE.md"]

# Include optional logging integrations and extras in the published API docs.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["policy", "redaction"]
policy = []
# Structural redaction always carries its JSON form: `Sensitive` requires
# `serde::Serialize`, and every sink value can be read as JSON.
redaction = ["policy", "dep:serde", "dep:serde_json"]
mask-map-keys = ["redaction"]
json = ["redaction"]
log = ["redaction", "dep:log"]
slog = ["redaction", "dep:slog", "dep:erased-serde", "redactable-derive/slog"]
tracing = ["redaction", "dep:tracing", "redactable-derive/tracing"]
tracing-valuable = ["tracing", "dep:valuable", "tracing/valuable"]
# Enables test helpers (`testing::assert_json_shape` needs `redaction`).
testing = []
chrono = ["dep:chrono"]
time = ["dep:time"]
ip-address = ["redaction"]
uuid = ["dep:uuid"]
extras = ["chrono", "time", "uuid", "ip-address"]

[lints]
workspace = true

[dependencies]
# Exact pin: the derive generates code against this crate's internal items, so
# the pair must always ship and resolve together.
redactable-derive = { version = "=0.15.2", path = "../redactable-derive" }
serde = { version = "1", optional = true, features = ["derive"] }
# The structured tracing adapter reads 128-bit integers from JSON numbers.
serde_json = { version = "1.0.130", optional = true }
log = { version = "0.4", optional = true, features = ["kv_serde"] }
erased-serde = { version = "0.3", optional = true }
slog = { version = "2.8", optional = true, features = ["nested-values"] }
tracing = { version = "0.1", optional = true }
valuable = { version = "0.1", optional = true, features = ["derive"] }
chrono = { version = "0.4", optional = true }
time = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
redactable-test-fixtures = { path = "../test-fixtures" }
serde = { version = "1", features = ["derive"] }
trybuild = "1"
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
valuable-serde = "0.1.1"
